name: Bug report
description: Something in Foldav does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder
        2. …
  - type: input
    id: version
    attributes:
      label: Foldav version
      description: Shown in About Foldav (main menu).
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - Flatpak
        - AUR
        - Fedora (COPR)
        - .deb package
        - Tarball
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and GNOME version
      placeholder: 'Fedora 44, GNOME 50'
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Connected through
      options:
        - GNOME Online Accounts
        - Browser sign-in or app password
  - type: input
    id: nextcloud
    attributes:
      label: Nextcloud version
      description: And whether it is behind a proxy or uses a certificate of your own.
      placeholder: '32, behind nginx'
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: What Foldav prints when started from a terminal with `foldav-linux` (Flatpak `flatpak run dev.aperte.Foldav`), after quitting the running one with Ctrl+Q.
      render: text
