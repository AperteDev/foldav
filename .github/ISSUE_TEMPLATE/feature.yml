name: Feature request
description: Suggest something Foldav could do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The task or situation, and what is missing or hard about it now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea of how it would look or behave, if you have one; other apps that do it well (Files, the Nextcloud web app) are welcome too.
  - type: dropdown
    id: part
    attributes:
      label: Part of Foldav
      options:
        - Browsing (icons, list, columns, path bar)
        - Working with files and folders
        - Sidebar and favorites
        - Sync and accounts
        - Something else
